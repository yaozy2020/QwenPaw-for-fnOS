name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches manifest version
        run: |
          manifest_version=$(awk -F= '/^version/ {gsub(/ /,"",$2); print $2; exit}' manifest)
          expected="${{ steps.tag.outputs.tag }}"
          expected="${expected#v}"
          echo "manifest=$manifest_version  tag=$expected"
          if [ "$manifest_version" != "$expected" ]; then
            echo "::error::manifest 版本号与 tag 不一致"
            exit 1
          fi

      - name: Preflight + AUDIT
        run: |
          chmod +x scripts/preflight.sh scripts/sync-version.py scripts/gen-audit.py
          bash scripts/preflight.sh
          python3 scripts/gen-audit.py --check

      # 零构建架构：控制台(index.html)与工程层直接进包，build.sh 只做
      # 预压缩(.gz/.br，容器内自带 node)与 fnpack 封装
      - name: Build fpk via fnpackup Docker
        env:
          FNPAYLOAD: ${{ github.workspace }}/fnpayload
        run: |
          mkdir -p "$FNPAYLOAD"
          tar -cf - \
            --exclude='./fnpayload' --exclude='./.git' \
            --exclude='./ui-fndesign' \
            --exclude='*.fpk' --exclude='*.fpk.sha256' \
            . | tar -xf - -C "$FNPAYLOAD"
          docker run --rm \
            --entrypoint /bin/bash \
            -e SKIP_GATES=1 \
            -e FPK_OUT=/app \
            -v "$FNPAYLOAD:/app" \
            snltty/fnpackup:v1.1.4 \
            -c "cd /app && bash build.sh"
          fpk=$(ls "$FNPAYLOAD"/qwenpaw_v*.fpk | head -n1)
          if [ -z "$fpk" ]; then
            echo "::error::fpk build failed"
            exit 1
          fi
          cp "$fpk" "${{ github.workspace }}/"
          cp "${fpk}.sha256" "${{ github.workspace }}/" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QwenPaw for fnOS ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/qwenpaw_v*.fpk
            ${{ github.workspace }}/qwenpaw_v*.fpk.sha256
