name: Release

# 手动触发或推送发布标签触发
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (e.g. v2.1.0 or v2.1.0-rc.2)"
        required: true
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        # 事件字段一律经 env 透传,不直接内插进 run 脚本:
        # workflow_dispatch 的 inputs.tag 是用户可控字符串,内插会变成
        # 脚本注入面(如 tag 含 `"; rm -rf ...` 时被 shell 执行)。
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # 标签必须形如 vX.Y.Z 或 vX.Y.Z-rc.N,其它形状一律拒绝,
          # 避免后续脚本拿任意字符串去拼路径/参数。
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::非法的标签名: '$TAG'(要求 vX.Y.Z 或 vX.Y.Z-rc.N)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # [0b] dispatch 的 tag 若已存在(指向旧提交),必须按 tag 指向的提交构建:
      # 否则会以 HEAD 代码出包挂到旧 tag 上发布,tag↔commit 一致性失守
      # (审查 构建 P2-4)。tag 不存在时保持 HEAD,由 softprops 以 HEAD 建 tag。
      - name: Checkout tag if it already exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --no-tags 2>/dev/null; then
            git checkout -q --detach "refs/tags/${TAG}"
            echo "dispatch: tag 已存在,按 tag 指向的提交构建"
          else
            echo "dispatch: tag 不存在,将以当前 HEAD 创建"
          fi

      # [1] 标签与 manifest 映射校验
      # 映射规则：
      #   v2.1.0-rc.2 -> manifest 2.1.0-2 -> prerelease=true
      #   v2.1.0      -> manifest 2.1.0   -> prerelease=false
      - name: Verify tag matches manifest mapping
        id: verify
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/verify-release-tag.py "$TAG" --github-output

      # [2] 不可变性校验：防止覆盖已存在 Release 资产
      - name: Check release immutability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          # fail-closed:查询本身失败(网络/鉴权)时不能当作"release 不存在"放行,
          # 否则不可变性检查在最需要生效的时候恰好失效。
          if ! ERR=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>&1); then
            case "$ERR" in
              *"release not found"*|*"Not Found"*)
                echo "Release $TAG 尚未创建，校验通过。"
                ;;
              *)
                echo "::error::无法确认 Release $TAG 是否已存在，拒绝继续（避免误覆盖）: $ERR"
                exit 1
                ;;
            esac
          else
            ASSET_COUNT="$ERR"
            if [ "${ASSET_COUNT:-0}" -gt 0 ]; then
              echo "::error::Release $TAG 已经存在且包含 $ASSET_COUNT 个已发布资产。严禁覆盖或重写已有 Release！"
              exit 1
            fi
            echo "Release $TAG 存在但无资产，允许继续发布。"
          fi

      # [3] 文件权限检查
      - name: Verify git exec bits
        run: |
          for f in app/ui/api.cgi app/ui/index.cgi cmd/main build.sh tools/fnpack; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            [ "$mode" = "100755" ] || { echo "::error::$f 应为 100755,实际 ${mode:-缺失}"; exit 1; }
          done

      # [4] 静态检查与门禁
      - name: Preflight + AUDIT + Unit Tests + strict Clippy
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bash scripts/preflight.sh
          python3 scripts/gen-audit.py --check
          (cd supervisor && cargo test --locked)
          (cd supervisor && cargo clippy --locked --all-targets -- -D warnings)

      # [4b] 构建环境(必须在 lint 之前:STRICT_CI 下 esbuild 层真正执行,
      # 否则发布门禁比 CI 弱一档 —— 审查 构建 P2-2)
      - name: Prepare build environment
        run: |
          npm ci --prefix web --registry=https://registry.npmmirror.com --no-audit --no-fund

      # [4c] 生命周期回归(与 ci.yml 同口径)
      - name: Lifecycle regression
        env:
          STRICT_CI: "1"
        run: bash scripts/lint.sh

      # [5] 双构建 SHA256 对比。
      # 覆盖范围:web 打包与 FPK 封装的确定性(每次都重算)。
      # 不覆盖:cargo target 复用带来的同工具链稳定输出 —— 真正的洁净房重建
      # 需要在独立容器内做,成本 +4min 以上,当前不作为发布阻塞项。
      - name: Dual-build reproducible verification
        id: build
        env:
          FNPACK_BIN: ${{ github.workspace }}/tools/fnpack
        run: |
          DIR1="${RUNNER_TEMP}/build1"
          DIR2="${RUNNER_TEMP}/build2"
          mkdir -p "$DIR1" "$DIR2"

          echo "=== 第一次构建 ==="
          FPK_OUT="$DIR1" bash build.sh
          FPK_FILE=$(ls "$DIR1"/qwenpaw*.fpk | head -n 1)
          FPK_NAME=$(basename "$FPK_FILE")
          SHA1=$(sha256sum "$DIR1/$FPK_NAME" | awk '{print $1}')

          echo "=== 第二次构建(洁净 web 产物) ==="
          # 双构建的意义是发现不确定性来源。Rust 侧 cargo 本身按内容哈希缓存、
          # 同一工具链下输出稳定;风险集中在 web 打包(文件遍历顺序、时间戳)
          # 与 fpk 封装顺序。因此第二次构建前清掉 web/dist 与 node_modules 缓存,
          # 让这两条路径真正重跑 —— 不是"同环境冒烟",而是对非确定性热点的复算。
          rm -rf web/dist web/node_modules/.cache
          npm ci --prefix web --registry=https://registry.npmmirror.com --no-audit --no-fund
          FPK_OUT="$DIR2" bash build.sh
          SHA2=$(sha256sum "$DIR2/$FPK_NAME" | awk '{print $1}')

          echo "Build 1 SHA256: $SHA1"
          echo "Build 2 SHA256: $SHA2"

          if [ "$SHA1" != "$SHA2" ]; then
            echo "::error::双构建 SHA256 不一致，违反确定性可重现构建约束！"
            exit 1
          fi

          echo "双构建一致性校验完全通过！"
          cp "$DIR1/$FPK_NAME" "${{ github.workspace }}/$FPK_NAME"
          cp "$DIR1/$FPK_NAME.sha256" "${{ github.workspace }}/$FPK_NAME.sha256"
          echo "fpk_name=$FPK_NAME" >> "$GITHUB_OUTPUT"
          echo "fpk_sha256=$SHA1" >> "$GITHUB_OUTPUT"

      # [5b] 真实 SIGKILL 崩溃注入。必须放在 release 二进制就绪之后
      # (脚本读 supervisor/target/release/qwenpaw-supervisor)。
      - name: Crash injection (7 real SIGKILL points)
        run: bash scripts/test-venv-recovery.sh

      # [6] FPK 内容全量审计
      - name: Audit generated FPK
        run: |
          bash scripts/audit-fpk.sh "${{ github.workspace }}/${{ steps.build.outputs.fpk_name }}"

      # [7] 自动生成包含“已知限制”的 Release 说明
      - name: Generate release notes with known limitations
        id: notes
        env:
          FPK_NAME_IN: ${{ steps.build.outputs.fpk_name }}
          SHA256_IN: ${{ steps.build.outputs.fpk_sha256 }}
          VERSION_IN: ${{ steps.verify.outputs.manifest_version }}
          TAG_IN: ${{ steps.tag.outputs.tag }}
        run: |
          FPK_NAME="$FPK_NAME_IN"
          SHA256="$SHA256_IN"
          VERSION="$VERSION_IN"
          TAG="$TAG_IN"

          cat <<EOF > release_notes.md
          # QwenPaw for fnOS ${TAG} (外壳版本 v${VERSION})

          ### 📦 发布包校验清单
          - **安装包**: \`${FPK_NAME}\`
          - **SHA256**: \`${SHA256}\`

          ---

          ### ⚠️ 已知限制与运行说明 (Known Limitations)
          1. **桌面图标动态隐藏限制**：
             - 由于飞牛 fnOS 桌面平台采用静态应用索引与桌面会话缓存机制，内核处于未安装或仅卸载状态时，外壳设置的 \`NoDisplay=true\` 状态可能不会立即在当前打开的桌面视图中消失；
             - 如需刷新图标状态，可按 \`F5\` 刷新浏览器页面或重新进入应用中心。
          2. **独立事务自愈保障**：
             - 本版本已正式闭环 venv 独立事务状态机。安装中途如遭遇断电或异常中断，监督者重启时会自动回滚或自愈，保障环境单一权威。
          3. **服务端口修改说明**：
             - 修改端口后监督者会自动热重启，请使用新端口访问管理控制台。
          EOF
          cat release_notes.md

      # [8] 创建并上传 Release
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QwenPaw for fnOS ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/${{ steps.build.outputs.fpk_name }}
            ${{ github.workspace }}/${{ steps.build.outputs.fpk_name }}.sha256

      # [9] 资产回读校验：从 GitHub 下载已上传资产并二次核对 SHA256
      - name: Verify release assets read-back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_IN: ${{ steps.tag.outputs.tag }}
          FPK_NAME_IN: ${{ steps.build.outputs.fpk_name }}
          SHA256_IN: ${{ steps.build.outputs.fpk_sha256 }}
        run: |
          TAG="$TAG_IN"
          FPK_NAME="$FPK_NAME_IN"
          EXPECTED_SHA="$SHA256_IN"

          DOWNLOAD_DIR="${RUNNER_TEMP}/readback"
          mkdir -p "$DOWNLOAD_DIR"
          cd "$DOWNLOAD_DIR"

          echo "从 Release $TAG 回读下载 $FPK_NAME ..."
          gh release download "$TAG" --repo "${{ github.repository }}" -p "$FPK_NAME" --dir "$DOWNLOAD_DIR"

          DOWNLOADED_SHA=$(sha256sum "$DOWNLOAD_DIR/$FPK_NAME" | awk '{print $1}')
          echo "本地构建 SHA256: $EXPECTED_SHA"
          echo "回读下载 SHA256: $DOWNLOADED_SHA"

          if [ "$EXPECTED_SHA" != "$DOWNLOADED_SHA" ]; then
            echo "::error::Release 资产回读 SHA256 不匹配！远程资产可能损坏或被截断！"
            exit 1
          fi
          echo "Release 资产回读二次核验完全一致！"
