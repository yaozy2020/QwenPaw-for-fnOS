name: Release

# 仅手动触发：推 tag 不会自动打包，避免半成品 tag 意外出包。
# 发版流程：确认版本 → git tag vX.Y.Z && git push → Actions → Release → Run workflow → 填入 tag 名
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.7)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches manifest version
        run: |
          manifest_version=$(awk -F= '/^version/ {gsub(/ /,"",$2); print $2; exit}' manifest)
          expected="${{ steps.tag.outputs.tag }}"
          expected="${expected#v}"
          echo "manifest=$manifest_version  tag=$expected"
          if [ "$manifest_version" != "$expected" ]; then
            echo "::error::manifest 版本号与 tag 不一致"
            exit 1
          fi

      - name: Verify git exec bits
        run: |
          for f in app/ui/api.cgi app/ui/index.cgi cmd/main build.sh tools/fnpack; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            [ "$mode" = "100755" ] || { echo "::error::$f 应为 100755,实际 ${mode:-缺失}"; exit 1; }
          done

      - name: Preflight + AUDIT
        run: |
          bash scripts/preflight.sh
          python3 scripts/gen-audit.py --check

      # 控制台经 esbuild 编译(web/src → 单文件 index.html);fnpack 为仓库内
      # vendor 的静态 ELF（x86-64，任意 Linux 可跑），不再依赖容器。
      # npm ci 保证按锁文件安装;build.sh 内含 cargo --locked 构建 + FPK 内容审计。
      - name: Build fpk (vendored static fnpack)
        env:
          FPK_OUT: ${{ github.workspace }}
          FNPACK_BIN: ${{ github.workspace }}/tools/fnpack
        run: |
          npm ci --prefix web --registry=https://registry.npmmirror.com --no-audit --no-fund
          bash build.sh
          ls -lh qwenpaw_v*.fpk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QwenPaw for fnOS ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/qwenpaw_v*.fpk
            ${{ github.workspace }}/qwenpaw_v*.fpk.sha256
