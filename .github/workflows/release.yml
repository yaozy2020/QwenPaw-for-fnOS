name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.3.0-1)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches manifest version
        run: |
          manifest_version=$(awk -F= '/^version/ {gsub(/ /,"",$2); print $2; exit}' manifest)
          expected="${TAG#v}"
          echo "manifest=$manifest_version  tag=$expected"
          if [ "$manifest_version" != "$expected" ]; then
            echo "::error::manifest 版本号与 tag 不一致"
            exit 1
          fi

      - name: Preflight + AUDIT
        run: |
          chmod +x scripts/preflight.sh scripts/sync-version.py scripts/gen-audit.py scripts/sync-upstream.sh
          bash scripts/preflight.sh

      - name: Sync upstream source
        run: bash scripts/sync-upstream.sh

      - name: Build panel (ui-fndesign → app/www)
        working-directory: ui-fndesign
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Build fpk via fnpackup Docker
        env:
          FNPAYLOAD: ${{ github.workspace }}/fnpayload
        run: |
          mkdir -p "$FNPAYLOAD"
          tar -cf - \
            --exclude='./fnpayload' --exclude='./.git' \
            --exclude='./ui-fndesign/node_modules' \
            --exclude='*.fpk' --exclude='*.fpk.sha256' \
            . | tar -xf - -C "$FNPAYLOAD"
          # 容器内执行 build.sh：跳过面板构建（产物已在 app/www/），console 在容器内构建
          docker run --rm \
            -e SKIP_FRONTEND=1 \
            -e NPM_CONFIG_REGISTRY="$NPM_CONFIG_REGISTRY" \
            -v "$FNPAYLOAD:/app" \
            snltty/fnpackup:v1.1.4 \
            /bin/bash -c "cd /app && bash build.sh"
          fpk=$(ls "$FNPAYLOAD"/com.dustinky.qwenpaw_*.fpk | head -n1)
          if [ -z "$fpk" ]; then
            echo "::error::fpk build failed"
            exit 1
          fi
          cp "$fpk" "${{ github.workspace }}/"
          cp "${fpk}.sha256" "${{ github.workspace }}/" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QwenPaw FPK ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/com.dustinky.qwenpaw_*.fpk
            ${{ github.workspace }}/com.dustinky.qwenpaw_*.fpk.sha256
