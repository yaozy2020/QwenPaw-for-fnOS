name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight (version SSOT + repo hygiene)
        run: |
          chmod +x scripts/preflight.sh scripts/sync-version.py scripts/gen-audit.py
          bash scripts/preflight.sh

      - name: Verify AUDIT_REPORT.md is up-to-date
        run: python3 scripts/gen-audit.py --check

      - name: Setup web toolchain (esbuild,lint 第 5 层依赖)
        run: npm install --prefix web --registry=https://registry.npmmirror.com --no-audit --no-fund

      - name: Lint (五层:bash -n + shellcheck + 桥接 JSON 门禁 + esbuild 编译)
        run: |
          chmod +x scripts/lint.sh scripts/preflight.sh scripts/sync-version.py scripts/gen-audit.py
          bash scripts/lint.sh

      - name: Console build + artifact sanity (web/src 经 esbuild 出单文件)
        run: |
          (cd web && BUILD_ID=ci node build.mjs)
          test -f web/dist/index.html
          grep -q "QwenPaw 控制台" web/dist/index.html
          grep -q "api.cgi" web/dist/index.html
          grep -q "statusCardMount" web/dist/index.html
          test -f app/ui/index.cgi
          test -f app/ui/api.cgi
