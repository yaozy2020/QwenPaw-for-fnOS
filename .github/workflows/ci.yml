name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # action 一律固定到提交 SHA(可变 tag 是供应链风险;SHA 与 tag 对应关系见注释)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify lifecycle and build exec bits
        run: |
          fail=0
          for f in cmd/main cmd/install_init cmd/install_callback cmd/upgrade_init \
                   cmd/upgrade_callback cmd/uninstall_init cmd/uninstall_callback \
                   cmd/config_init cmd/config_callback build.sh scripts/lint.sh \
                   scripts/preflight.sh scripts/audit-fpk.sh tools/fnpack; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error::$f 的 git 模式是 ${mode:-缺失},应为 100755"
              fail=1
            fi
          done
          exit $fail

      - name: Preflight (version SSOT + repo hygiene)
        run: bash scripts/preflight.sh

      - name: Verify AUDIT_REPORT.md is up-to-date
        run: python3 scripts/gen-audit.py --check

      - name: Setup Node (pin 版本,避免上游默认值漂移)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup web toolchain (npm ci,锁文件一致性)
        # 默认走官方 registry:硬编码国内镜像会让境外 runner 变慢甚至失败,
        # 也会掩盖上游包缺失的真实故障。需要镜像时用仓库变量覆盖即可。
        run: npm ci --prefix web --registry="${NPM_REGISTRY}" --no-audit --no-fund
        env:
          NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}

      - name: Frontend dependency audit
        run: npm audit --prefix web --registry=https://registry.npmjs.org

      - name: Frontend Node tests
        run: npm test --prefix web

      - name: Frontend strict typecheck
        run: npm run typecheck --prefix web

      - name: Install Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Chromium Gateway UDS E2E delivery gate
        run: npm run test:e2e:gateway --prefix web

      - name: Build release binaries for runtime regressions
        run: cargo build --locked --release --manifest-path supervisor/Cargo.toml

      - name: Lint (bash -n + shellcheck + management boundary + esbuild 编译)
        run: STRICT_CI=1 bash scripts/lint.sh

      - name: Console build + Gateway artifact sanity (web/src 经 esbuild 出单文件)
        run: |
          (cd web && BUILD_ID=ci node build.mjs)
          test -f web/dist/index.html
          grep -q "QwenPaw 控制台" web/dist/index.html
          grep -q "/app/qwenpaw/api" web/dist/index.html
          grep -q "statusCardMount" web/dist/index.html
          ! grep -q "api.cgi\|index.cgi" web/dist/index.html
          test ! -e app/ui/api.cgi
          test ! -e app/ui/index.cgi

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: supervisor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Show toolchain (ubuntu runner 预装 rust;缺失时此步即失败)
        run: |
          cargo --version
          rustc --version

      # 监督者是安全修复的主战场:测试与 lint 必须真实执行,不允许静默 skip
      - name: cargo test --locked
        run: sudo -E env "PATH=$PATH" cargo test --locked

      - name: cargo clippy --locked (warnings = errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo build --locked --release
        run: cargo build --locked --release

      # 这两项需要刚构建的 release supervisor/test-runtime 与真实 venv；
      # 故与 lint 分开在产物就绪后显式执行，不提供静默 skip。
      - name: Platform callback regression
        working-directory: .
        run: python3 scripts/test-platform-callbacks.py

      - name: Real venv runtime contract
        working-directory: .
        run: python3 scripts/test-runtime-venv-contract.py

      - name: Binary sanity
        run: |
          test -x target/release/qwenpaw-supervisor
          file target/release/qwenpaw-supervisor
          sha256sum target/release/qwenpaw-supervisor

      # 真实 SIGKILL 故障注入:逐个中断点杀进程,重启后验证自愈。
      # 单元测试只验证纯函数语义,这条才真正覆盖"断电/被 KILL"的磁盘状态。
      - name: Venv transaction crash-injection (7 real SIGKILL points)
        working-directory: .
        run: bash scripts/test-venv-recovery.sh

      - name: Supervisor API and configuration transactions
        working-directory: .
        run: python3 scripts/test-supervisor-api.py
