name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight (version SSOT + repo hygiene)
        run: |
          chmod +x scripts/preflight.sh scripts/sync-version.py scripts/gen-audit.py
          bash scripts/preflight.sh

      - name: Verify AUDIT_REPORT.md is up-to-date
        run: python3 scripts/gen-audit.py --check

      - name: Shell syntax gate (cmd/ + cgi + build.sh)
        run: |
          for f in cmd/* app/ui/*.cgi build.sh; do
            bash -n "$f" || { echo "::error::语法错误: $f"; exit 1; }
          done

      - name: Console artifact sanity (零构建架构，控制台为提交产物)
        run: |
          test -f app/www/index.html
          grep -q "QwenPaw 控制台" app/www/index.html
          grep -q "api.cgi" app/www/index.html
          test -f app/ui/index.cgi
          test -f app/ui/api.cgi
