[package]
name = "qwenpaw-supervisor"
version = "1.2.0-rc.1"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
hyper = { version = "1.12", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service", "client", "client-legacy"] }
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["compression-gzip"] }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
scraper = { version = "0.22.0", default-features = false }
percent-encoding = "2.3.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
